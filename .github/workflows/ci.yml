# ============================================================
# Agentic Knowledge Graph Reasoning Engine
# GitHub Actions CI/CD Pipeline
# ============================================================
# Jobs:
#   test  — pytest with coverage (parallel with lint)
#   lint  — ruff + mypy          (parallel with test)
#   build — Docker image → GHCR  (after test passes, main only)
#   deploy— kubectl apply        (after build, main only)
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agentic-knowledge-graph
  PYTHON_VERSION: "3.11"

# ─────────────────────────────────────────────
# JOB 1 — test (runs on every push / PR)
# ─────────────────────────────────────────────
jobs:
  test:
    name: pytest + coverage
    runs-on: ubuntu-latest

    # Provide a real Neo4j for integration tests
    services:
      neo4j:
        image: neo4j:5.18-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s

    env:
      # Real secrets injected from repository secrets
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      CHROMA_PATH: /tmp/chroma_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Cache pip wheels keyed on requirements hash so installs are
      # only repeated when dependencies change.
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Wait for Neo4j to be ready
        run: |
          echo "Waiting for Neo4j bolt..."
          for i in $(seq 1 20); do
            nc -z localhost 7687 && echo "Neo4j bolt is up" && break
            echo "Attempt $i — sleeping 5 s"
            sleep 5
          done

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            --tb=short

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          flags: unittests
          name: akg-coverage
          fail_ci_if_error: false

  # ─────────────────────────────────────────────
  # JOB 2 — lint (parallel with test)
  # ─────────────────────────────────────────────
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          # Install stubs and the app's own deps so mypy can resolve imports
          pip install -r requirements.txt

      - name: ruff — style + import order + security rules
        run: |
          ruff check app/ \
            --select E,W,F,I,S,B,C4,UP \
            --ignore E501 \
            --output-format=github

      - name: ruff — format check (no auto-fix in CI)
        run: ruff format app/ --check

      - name: mypy — strict type checking
        run: |
          mypy app/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --warn-return-any \
            --warn-unused-ignores \
            --pretty

  # ─────────────────────────────────────────────
  # JOB 3 — build Docker image → GHCR
  # Only runs on push to main after tests pass.
  # ─────────────────────────────────────────────
  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: [test]                        # lint is advisory; test is gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write                    # required to push to GHCR

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by Actions

      # Generate image tags:
      #   ghcr.io/<owner>/agentic-knowledge-graph:latest
      #   ghcr.io/<owner>/agentic-knowledge-graph:<short-sha>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Agentic Knowledge Graph Reasoning Engine
            org.opencontainers.image.description=Cybersecurity MITRE ATT&CK knowledge graph
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Output image summary
        run: |
          echo "### Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # JOB 4 — deploy (after build, main only)
  # Replace the echo commands with real kubectl /
  # Helm / ArgoCD calls once infrastructure is set up.
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://akg.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── AWS credentials ─────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Connect kubectl to EKS cluster ──────────────────────────────────
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      # ── Patch deployment image tag with the SHA just built ───────────────
      - name: Update image tag in deployment manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          sed -i "s|ghcr.io/GITHUB_OWNER/agentic-knowledge-graph:latest|${IMAGE}|g" \
            k8s/api-deployment.yaml
          echo "Deploying image: ${IMAGE}"

      # ── Apply all Kubernetes manifests ───────────────────────────────────
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/chroma-pvc.yaml
          kubectl apply -f k8s/neo4j-statefulset.yaml
          kubectl apply -f k8s/neo4j-service.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml

      # ── Wait for rollout to complete ─────────────────────────────────────
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/akg-api \
            -n akg-production \
            --timeout=300s

      # ── Smoke test against live endpoint ─────────────────────────────────
      - name: Smoke test
        run: |
          HEALTH_URL="https://akg.yourdomain.com/api/v1/health"
          STATUS=$(curl -sf "${HEALTH_URL}" | jq -r '.status')
          echo "Health status: ${STATUS}"
          if [ "${STATUS}" != "healthy" ] && [ "${STATUS}" != "degraded" ]; then
            echo "Smoke test FAILED — status=${STATUS}"
            exit 1
          fi
          echo "Smoke test PASSED"

      - name: Notify deployment success
        run: |
          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | \`${{ secrets.EKS_CLUSTER_NAME }}\` |" >> $GITHUB_STEP_SUMMARY

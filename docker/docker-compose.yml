# ============================================================
# Agentic Knowledge Graph Reasoning Engine
# Docker Compose — development + production stack
# ============================================================
# Usage:
#   cp .env.example .env        # fill in secrets
#   docker compose up --build   # start all services
# ============================================================

version: "3.9"

# --------------- Shared network ---------------
networks:
  kg_network:
    driver: bridge
    name: kg_network

# --------------- Named volumes ----------------
volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

# --------------- Services ---------------------
services:

  # ---- FastAPI / LangGraph Agent service ----
  api:
    build:
      context: ..                    # repo root (so COPY . . in Dockerfile works)
      dockerfile: docker/Dockerfile
    image: agentic-knowledge-graph:latest
    container_name: akg_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env                      # load secrets from repo-root .env
    environment:
      # Override / supplement values from .env
      NEO4J_URI: bolt://neo4j:7687   # use service name inside Docker network
      CHROMA_PATH: /app/data/chroma
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../data:/app/data            # persist ChromaDB on host
    depends_on:
      neo4j:
        condition: service_healthy   # wait until Neo4j reports healthy
    networks:
      - kg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    # Resource limits (adjust to your host capacity)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ---- Neo4j Community Edition ----
  neo4j:
    image: neo4j:5.18-community
    container_name: akg_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (driver connections)
    environment:
      # Format: neo4j/<password>  — change password in .env before production!
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      # Performance tuning for a containerised environment
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      # Enable APOC plugin (required for graph algorithms)
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - kg_network
    healthcheck:
      # Neo4j exposes a simple HTTP endpoint we can poll
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:7474"
        ]
      interval: 15s
      timeout: 10s
      start_period: 60s    # Neo4j can take up to ~45 s to initialise
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

apiVersion: v1
kind: ConfigMap
metadata:
  name: akg-config
  namespace: akg-production
data:
  NEO4J_URI: "bolt://neo4j-service:7687"
  NEO4J_USER: "neo4j"
  CHROMA_PATH: "/app/data/chroma"
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  LLM_MODEL: "claude-sonnet-4-6"
  MAX_ITERATIONS: "3"
  TOP_K_VECTOR: "10"
  TOP_K_GRAPH: "10"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

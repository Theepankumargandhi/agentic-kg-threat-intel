apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: akg-production
  labels:
    app: neo4j
spec:
  serviceName: neo4j-service
  replicas: 1                        # Neo4j Community Edition is single-node
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.18-community
          ports:
            - containerPort: 7474    # HTTP browser
              name: http
            - containerPort: 7687    # Bolt protocol
              name: bolt

          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: akg-secrets
                  key: NEO4J_PASSWORD
                  # Kubernetes will interpolate as "neo4j/<value>"
            - name: NEO4J_AUTH_FORMATTED
              value: "neo4j/$(NEO4J_PASSWORD)"
            - name: NEO4J_server_memory_heap_initial__size
              value: "512m"
            - name: NEO4J_server_memory_heap_max__size
              value: "2G"
            - name: NEO4J_server_memory_pagecache_size
              value: "1G"
            - name: NEO4J_PLUGINS
              value: '["apoc"]'

          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-logs
              mountPath: /logs

          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

  # ── Persistent Volume Claims (EBS on AWS) ───────────────────────────────
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3             # AWS EBS gp3 storage class
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: neo4j-logs
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 5Gi

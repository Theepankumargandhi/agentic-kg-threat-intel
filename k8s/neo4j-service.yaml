apiVersion: v1
kind: Service
metadata:
  name: neo4j-service
  namespace: akg-production
  labels:
    app: neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
  type: ClusterIP          # internal only — never expose Neo4j publicly

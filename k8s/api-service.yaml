apiVersion: v1
kind: Service
metadata:
  name: akg-api-service
  namespace: akg-production
  labels:
    app: akg-api
spec:
  selector:
    app: akg-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP       # exposed externally via Ingress below

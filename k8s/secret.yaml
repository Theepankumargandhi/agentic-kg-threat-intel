# DO NOT commit real values — use AWS Secrets Manager or kubectl create secret
# To create from CLI:
#   kubectl create secret generic akg-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=NEO4J_PASSWORD=your-password \
#     -n akg-production
apiVersion: v1
kind: Secret
metadata:
  name: akg-secrets
  namespace: akg-production
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_WITH_REAL_KEY"
  NEO4J_PASSWORD: "REPLACE_WITH_REAL_PASSWORD"
